<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="给孩子看的希腊众神互动图：家谱、三界、谁管什么、小测验，中英双语并支持语音讲解">
<title>奥林匹斯众神家谱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: sticky language/voice bar, marble page, clickable family tree + detail card, three realms, "who does what" grid, quiz. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --ink:#15203a; --muted:#5a6680; --line:#c6cfdd; --faint:#e3e8ef;
  --aegean:#1d5fa6; --gold:#a8771f; --rose:#c2456b; --on-accent:#ffffff;
  --c-pri:#6b5ca5; --c-titan:#8a6435; --c-oly:#1d5fa6; --c-god:#24806c; --c-mate:#7c8598;
  --sky1:#bcd8f5; --sky2:#e7f1fb; --sea1:#2f78b5; --sea2:#1a4f86; --und1:#2a2238; --und2:#120e1a;
  --f-display:"Noto Serif SC","Songti SC",serif; --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif; --f-latin:"Cinzel","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1322; --surface:#161f35; --ink:#e6ebf4; --muted:#98a4bd; --line:#34405e; --faint:#1d2742;
  --aegean:#74abe9; --gold:#e2b75e; --rose:#ef7c9d; --on-accent:#0d1322;
  --c-pri:#a99ce3; --c-titan:#cfa66c; --c-oly:#74abe9; --c-god:#5cc4aa; --c-mate:#8d97ab;
  --sky1:#2b4f7d; --sky2:#1b3352; --sea1:#174a78; --sea2:#0f3256; --und1:#1d1729; --und2:#0a0810;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1322; --surface:#161f35; --ink:#e6ebf4; --muted:#98a4bd; --line:#34405e; --faint:#1d2742;
  --aegean:#74abe9; --gold:#e2b75e; --rose:#ef7c9d; --on-accent:#0d1322;
  --c-pri:#a99ce3; --c-titan:#cfa66c; --c-oly:#74abe9; --c-god:#5cc4aa; --c-mate:#8d97ab;
  --sky1:#2b4f7d; --sky2:#1b3352; --sea1:#174a78; --sea2:#0f3256; --und1:#1d1729; --und2:#0a0810;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
.page{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:0 64px;display:flex;flex-direction:column;gap:56px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.latin{font-family:var(--f-latin);letter-spacing:.04em}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-family:var(--f-latin);font-weight:700}
.lede{color:var(--muted);max-width:62ch;margin:0}
section>header{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
h2{font-size:clamp(22px,3vw,28px)}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:flex-end;padding-block:10px;border-bottom:1px solid var(--line);margin-inline:-20px;padding-inline:20px}
.seg{display:inline-flex;border:1.5px solid var(--aegean);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--aegean);font:inherit;font-weight:700;font-size:14px;padding:5px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--aegean);color:var(--on-accent)}
.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--aegean)}
.no-voice{font-size:12px;color:var(--muted)}

/* speak buttons */
.speak{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--aegean);background:var(--surface);color:var(--aegean);font:inherit;font-weight:700;font-size:13px;
  padding:4px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.speak:hover{background:color-mix(in srgb,var(--aegean) 10%,var(--surface))}
.speak.playing{background:var(--aegean);color:var(--on-accent)}
.speak:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* hero */
.hero{display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);padding-block:28px}
.hero h1{font-size:clamp(32px,6vw,54px);font-weight:900;letter-spacing:.02em;line-height:1.15}
.hero h1 .sub{display:block;font-size:.36em;color:var(--gold);font-weight:500;letter-spacing:.2em;margin-top:6px}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--c);display:inline-block}

/* tree */
.tree-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:1100px){.tree-layout{grid-template-columns:minmax(0,1fr)}}
.tree-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.tree-sizer{position:relative}
.tree{position:absolute;left:0;top:0;width:1180px;height:600px;transform-origin:0 0}
.tree svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.band{fill:var(--faint)}
.band-label{fill:var(--muted);font-size:12px;letter-spacing:.08em;font-family:var(--f-body)}
.link{fill:none;stroke:var(--line);stroke-width:1.6;transition:stroke .2s,opacity .2s}
.link.dash{stroke-dasharray:5 5}
.link.on{stroke:var(--aegean);stroke-width:2.6}
.link.dim{opacity:.25}
.mate{fill:none;stroke:var(--rose);stroke-width:2.4;stroke-dasharray:3 5}
.node{position:absolute;width:88px;height:76px;margin-left:-44px;border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);
  border-top:5px solid var(--c);border-radius:10px;background:color-mix(in srgb,var(--c) 10%,var(--surface));
  color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;
  transition:transform .15s,opacity .2s,box-shadow .2s}
.node:hover{transform:translateY(-2px)}
.node:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.node .g{font-size:20px;line-height:1.2}
.node .n1{font-weight:700;font-size:14px;line-height:1.25;white-space:nowrap}
.node .n2{font-size:10px;color:var(--muted);line-height:1.2;white-space:nowrap}
html[lang="en"] .node .n1{font-family:var(--f-latin);font-size:11.5px;letter-spacing:0}
.node.dim{opacity:.32}
.node.sel{box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 70%,transparent);opacity:1}
.cat-pri{--c:var(--c-pri)} .cat-titan{--c:var(--c-titan)} .cat-oly{--c:var(--c-oly)} .cat-god{--c:var(--c-god)} .cat-mate{--c:var(--c-mate)}

/* detail */
.detail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:1100px){.detail{position:static}}
.d-head{display:flex;gap:14px;align-items:center}
.d-head>div:nth-child(2){flex:1;min-width:0}
.d-glyph{font-size:40px;width:64px;height:64px;display:grid;place-items:center;border-radius:14px;background:color-mix(in srgb,var(--c) 14%,var(--surface));flex:none}
.d-head h3{font-size:26px;line-height:1.2}
.d-sub{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);font-weight:700}
.d-role{font-family:var(--f-display);font-size:19px;font-weight:600;color:var(--c);line-height:1.4}
.d-row{display:grid;grid-template-columns:6.2em 1fr;gap:8px;font-size:14px}
.d-row b{color:var(--muted);font-weight:500}
.d-story{font-size:14px;margin:0;padding:10px 12px;background:var(--faint);border-radius:10px}
.d-note{font-size:12px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:2px 10px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--aegean);color:var(--aegean)}
.chip:focus-visible{outline:2px solid var(--gold)}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}

/* realms */
.realms{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:stretch}
@media (max-width:800px){.realms{grid-template-columns:minmax(0,1fr)}}
.strata{border-radius:16px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.stratum{padding:18px 20px;display:flex;gap:16px;align-items:center;cursor:pointer;border:0;font:inherit;text-align:left;width:100%}
.stratum .g{font-size:38px;flex:none}
.stratum h3{font-size:20px}
.stratum p{margin:0;font-size:14px;opacity:.9}
.stratum:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.s-sky{background:linear-gradient(180deg,var(--sky2),var(--sky1));color:var(--ink);min-height:130px}
.s-earth{background:var(--surface);color:var(--ink);border-block:1px solid var(--line)!important;cursor:default}
.s-sea{background:linear-gradient(180deg,var(--sea1),var(--sea2));color:#eef5ff;min-height:130px}
.s-und{background:linear-gradient(180deg,var(--und1),var(--und2));color:#e9e3f5;min-height:130px}
.realm-story{display:flex;flex-direction:column;gap:12px;font-size:15px;align-items:flex-start}
.realm-story p{margin:0}
.realm-story .callout{border-left:3px solid var(--gold);padding-left:12px;color:var(--muted)}

/* who does what */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:44px 1fr;gap:4px 12px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--c);transform:translateY(-2px)}
.card:focus-visible{outline:3px solid var(--gold)}
.card .g{font-size:30px;grid-row:span 3;align-self:start}
.card .job{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--c);line-height:1.35}
.card .nm{font-weight:700}
.card .nm span{font-weight:500;font-size:12px;color:var(--muted);margin-left:6px}
.card .rm{font-size:12px;color:var(--muted)}

/* quiz */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;max-width:760px}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.q-score{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.q-clue{font-family:var(--f-display);font-size:20px;line-height:1.5;margin:0}
.q-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.q-opts{grid-template-columns:minmax(0,1fr)}}
.opt{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left}
.opt small{font-size:12px;color:var(--muted);margin-left:4px}
.opt:hover:not(:disabled){border-color:var(--aegean)}
.opt:focus-visible{outline:3px solid var(--gold)}
.opt.right{border-color:var(--c-god);background:color-mix(in srgb,var(--c-god) 14%,var(--surface))}
.opt.wrong{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,var(--surface))}
.q-feedback{min-height:1.6em;margin:0;font-size:14px}
.btn{align-self:flex-start;background:var(--aegean);color:var(--on-accent);border:0;border-radius:10px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="page">
  <div class="bar">
    <div class="seg" role="group" aria-label="Language">
      <button type="button" id="langZh" data-lang="zh">中文</button>
      <button type="button" id="langEn" data-lang="en">English</button>
    </div>
    <label class="toggle"><input type="checkbox" id="autoSpeak"><span data-t="auto"></span></label>
    <span class="no-voice" id="noVoice" hidden></span>
  </div>

  <header class="hero">
    <div class="eyebrow" data-t="eyebrow"></div>
    <h1><span data-t="h1"></span><span class="sub latin" data-t="h1sub"></span></h1>
    <p class="lede" data-t="lede"></p>
  </header>

  <section id="tree">
    <header>
      <div class="eyebrow">Family Tree</div>
      <h2 data-t="treeH"></h2>
    </header>
    <div class="legend" id="legend"></div>
    <div class="tree-layout">
      <div class="tree-wrap" id="treeWrap">
        <div class="tree-sizer" id="treeSizer">
          <div class="tree" id="treeInner">
            <svg id="treeSvg" viewBox="0 0 1180 600" aria-hidden="true"></svg>
          </div>
        </div>
      </div>
      <aside class="detail" id="detail" aria-live="polite"></aside>
    </div>
    <p class="hint" data-t="hint"></p>
  </section>

  <section id="realms">
    <header>
      <div class="eyebrow">Three Realms</div>
      <h2 data-t="realmH"></h2>
    </header>
    <div class="realms">
      <div class="strata">
        <button class="stratum s-sky" data-god="zeus" type="button"><span class="g">⚡</span><div><h3 data-t="skyH"></h3><p data-t="skyP"></p></div></button>
        <div class="stratum s-earth"><span class="g">⛰️</span><div><h3 data-t="earthH"></h3><p data-t="earthP"></p></div></div>
        <button class="stratum s-sea" data-god="poseidon" type="button"><span class="g">🔱</span><div><h3 data-t="seaH"></h3><p data-t="seaP"></p></div></button>
        <button class="stratum s-und" data-god="hades" type="button"><span class="g">🐕</span><div><h3 data-t="undH"></h3><p data-t="undP"></p></div></button>
      </div>
      <div class="realm-story" id="realmStory">
        <button type="button" class="speak" id="speakRealm"></button>
        <p data-t="rs1"></p>
        <p data-t="rs2"></p>
        <p data-t="rs3"></p>
        <p class="callout" data-t="rs4"></p>
      </div>
    </div>
  </section>

  <section id="jobs">
    <header>
      <div class="eyebrow">Who Does What</div>
      <h2 data-t="jobsH"></h2>
      <p class="lede" data-t="jobsP"></p>
    </header>
    <div class="grid" id="grid"></div>
  </section>

  <section id="quiz">
    <header>
      <div class="eyebrow">Quiz</div>
      <h2 data-t="quizH"></h2>
    </header>
    <div class="quiz">
      <div class="q-top"><span class="d-sub" id="qNum"></span><span class="q-score" id="qScore"></span></div>
      <p class="q-clue" id="qClue"></p>
      <div><button type="button" class="speak" id="speakQ"></button></div>
      <div class="q-opts" id="qOpts"></div>
      <p class="q-feedback" id="qFb"></p>
      <button class="btn" id="qNext" type="button"></button>
    </div>
  </section>

  <footer data-t="footer"></footer>
</div>

<script>
/* ---------- text ---------- */
const T={
 zh:{auto:"点击时自动讲解",eyebrow:"Greek Mythology · 给孩子的众神图",h1:"奥林匹斯众神家谱",h1sub:"The Gods of Olympus",
  lede:"古希腊人相信，世界上的每件事都有一位神在管：打雷归宙斯，大海归波塞冬，种庄稼归得墨忒耳。这一页把众神的家族关系和各自的“工作”画在一起。点一点任何一位神，看看 TA 的爸爸妈妈、兄弟姐妹和孩子是谁。点 🔊 可以听讲解。",
  treeH:"众神家谱：从大地到奥林匹斯山",hint:"蓝线连接父母和孩子，粉色虚线连接夫妻。虚线的蓝线表示“另一种说法”。在手机上可以左右滑动家谱。",
  realmH:"三兄弟分天下",skyH:"天空 · 宙斯",skyP:"住在奥林匹斯山顶，掌管天空、雷电和众神。",earthH:"大地与奥林匹斯山",earthP:"大家共享。得墨忒耳让庄稼生长，赫斯提亚守护家里的炉火。",
  seaH:"大海 · 波塞冬",seaP:"掌管所有的海洋、风暴和地震。",undH:"冥界 · 哈迪斯",undP:"地底下的世界，由三头犬刻耳柏洛斯看门。",
  rs1:"泰坦之王克洛诺斯害怕孩子抢走王位，孩子一出生就被他吞进肚子。妈妈瑞亚把最小的宙斯藏了起来，用一块包着布的石头骗过了克洛诺斯。",
  rs2:"宙斯长大后，让父亲把哥哥姐姐们都吐了出来。他们一起和泰坦打了十年大战，最后赢了。",
  rs3:"胜利之后，宙斯、波塞冬、哈迪斯三兄弟<strong>抽签</strong>分世界：宙斯抽到天空，波塞冬抽到大海，哈迪斯抽到冥界。",

  listen:"🔊 听讲解",listenStory:"🔊 听故事",readQ:"🔊 读题",stop:"⏹ 停止",
  sym:"标志",trace:"今天还能看到",par:"父母",mates:"配偶 / 伴侣",kids:"孩子",sibs:"兄弟姐妹",roman:"罗马名",notShown:"（图中未画出）",
  noVoice:"这台设备没有中文语音，讲解可能无法播放。",
  cat:{pri:"太初神",titan:"泰坦神",oly:"奥林匹斯主神",god:"其他重要的神",mate:"宙斯孩子的妈妈"},
  bands:["太初神","泰坦神","克洛诺斯的孩子 · 宙斯孩子的妈妈","下一代神"],
  qNum:(i,n)=>`第 ${i} / ${n} 题`,qScore:s=>`得分 ${s}`,qClue:(r,s)=>`我管的是“${r}”，我的标志是${s}。我是谁？`,
  next:"下一题",result:"看成绩",again:"再玩一次",right:"答对了！",wrongIs:n=>`是${n}。`,
  final:(s,n)=>`答对 ${s} / ${n} 题。`+(s>=8?"你已经是奥林匹斯小专家了！":s>=5?"不错！再看看家谱，下次一定更好。":"去上面的卡片里逛一逛，再来挑战吧。"),
  say:d=>`${d.n}。${d.role}。${d.n}的标志是${d.sym}。${d.story}${d.trace?`今天我们还能在这里看到${d.n}：${d.trace}。`:""}`},

const synth=window.speechSynthesis;let voices=[],playingBtn=null,speakToken=0;

function pickVoice(){const want=lang==="zh"?/^zh[-_](CN|Hans)/i:/^en[-_]US/i,fam=lang==="zh"?/^zh/i:/^en/i;
  const c=voices.filter(v=>want.test(v.lang));const pool=c.length?c:voices.filter(v=>fam.test(v.lang));
  const pref=/Natural|Online|Neural|Google|Xiaoxiao|Yunxi|Tingting|Ting-Ting|Samantha|Aria|Jenny/i;

  const v=pickVoice(),tok=++speakToken;
  if(btn){playingBtn=btn;btn.classList.add("playing");btn.textContent=L().stop;}

    synth.speak(u);});
}

function chips(list){return list.length?`<div class="chips">${list.map(k=>`<button type="button" class="chip" data-god="${k}">${G[k].g} ${d(k).n}</button>`).join("")}</div>`:`<span class="d-sub">${L().notShown}</span>`;}
const detail=document.getElementById("detail");
function renderDetail(){const x=d(current),t=L(),o=G[current],par=o.p||[],kids=o.kids,mates=partners(current),sibs=siblings(current);
  detail.className="detail cat-"+x.cat;
  detail.innerHTML=`<div class="d-head"><div class="d-glyph">${x.g}</div><div><h3>${x.n}</h3><div class="d-sub">${x.other}${x.roman&&x.roman!==G[current].n[1]?` · ${t.roman} <span class="latin">${x.roman}</span>`:""}</div><span class="tag">${t.cat[x.cat]}</span></div></div>
  <div><button type="button" class="speak" id="speakGod"></button></div>
  <div class="d-role">${x.role}</div>
  <div class="d-row"><b>${t.sym}</b><span>${x.sym}</span></div>
  ${x.trace?`<div class="d-row"><b>${t.trace}</b><span>${x.trace}</span></div>`:""}
  <p class="d-story">${x.story}</p>
  ${x.note?`<p class="d-note">${x.note}</p>`:""}
  <div class="d-row"><b>${t.par}</b>${chips(par)}</div>
  ${mates.length?`<div class="d-row"><b>${t.mates}</b>${chips(mates)}</div>`:""}
  ${kids.length?`<div class="d-row"><b>${t.kids}</b>${chips(kids)}</div>`:""}
  ${sibs.length?`<div class="d-row"><b>${t.sibs}</b>${chips(sibs)}</div>`:""}`;
  const sb=document.getElementById("speakGod");setSpeakLabel(sb,t.listen);sb.onclick=()=>speak(t.say(d(current)),sb);
  detail.querySelectorAll(".chip").forEach(c=>c.onclick=()=>select(c.dataset.god,false,true));
}
function select(id,scroll,user){current=id;const o=G[id];
  const rel=new Set([id,...(o.p||[]),...o.kids,...partners(id),...siblings(id)]);
  ids.forEach(k=>{nodes[k].classList.toggle("sel",k===id);nodes[k].classList.toggle("dim",!rel.has(k));});
  links.forEach(l=>{const on=l.p===id||l.c===id;l.path.classList.toggle("on",on);l.path.classList.toggle("dim",!on);});
  mateLayer.innerHTML="";o.mates.forEach(m=>{const b=G[m],ay=ROWS[o.r]+NODE_H,by=ROWS[b.r]+NODE_H,my=Math.max(ay,by)+40;
    mateLayer.appendChild(el("path",{class:"mate",d:`M${o.x},${ay} Q${(o.x+b.x)/2},${my} ${b.x},${by}`}));});
  if(playingBtn&&playingBtn.id==="speakGod")stopSpeech();
  renderDetail();
  if(user&&autoSpeak){const sb=document.getElementById("speakGod");speak(L().say(d(id)),sb);}
  if(scroll)document.getElementById("tree").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  const s=scale();if(wrap.scrollWidth>wrap.clientWidth)wrap.scrollTo({left:o.x*s-wrap.clientWidth/2,behavior:"smooth"});
}
const wrap=document.getElementById("treeWrap"),sizer=document.getElementById("treeSizer");
function scale(){return Math.max(.62,Math.min(1,(wrap.clientWidth-16)/W));}
function fit(){const s=scale();inner.style.transform=`scale(${s})`;sizer.style.width=W*s+"px";sizer.style.height=600*s+"px";}
fit();new ResizeObserver(fit).observe(wrap);

/* ---------- static sections ---------- */
const ORDER=["zeus","hera","poseidon","hades","demeter","hestia","athena","apollo","artemis","hermes","ares","hephaestus","aphrodite","dionysus","persephone","muses"];
function renderGrid(){const t=L();document.getElementById("grid").innerHTML=ORDER.map(id=>{const x=d(id);return `<button type="button" class="card cat-${x.cat}" data-god="${id}"><span class="g">${x.g}</span><span class="job">${x.role}</span><span class="nm">${x.n}<span>${x.other}</span></span><span class="rm">${t.roman} ${x.roman||"—"} · ${x.sym}</span></button>`;}).join("");
  document.querySelectorAll("#grid .card").forEach(b=>b.onclick=()=>select(b.dataset.god,true,true));}
document.querySelectorAll(".stratum[data-god]").forEach(b=>b.onclick=()=>select(b.dataset.god,true,true));
const realmBtn=document.getElementById("speakRealm");
realmBtn.onclick=()=>{const t=L();speak([t.rs1,t.rs2,t.rs3,t.rs4].join(lang==="zh"?"":" "),realmBtn);};

/* ---------- quiz ---------- */
const POOL=ORDER.slice(),TOTAL=10;let qi=0,score=0,cur,opts=[],answered=null,done=false;
let deck=POOL.slice().sort(()=>Math.random()-.5).slice(0,TOTAL);
const qBtn=document.getElementById("speakQ");
function newQ(){cur=deck[qi];answered=null;opts=[cur,...POOL.filter(k=>k!==cur).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);renderQ();}
function clue(){const x=d(cur);return L().qClue(x.role,x.sym);}
function renderQ(){const t=L();setSpeakLabel(qBtn,t.readQ);
  document.getElementById("qScore").textContent=t.qScore(score);
  if(done){document.getElementById("qNum").textContent="";document.getElementById("qClue").textContent=t.final(score,TOTAL);document.getElementById("qOpts").innerHTML="";document.getElementById("qFb").textContent="";document.getElementById("qNext").textContent=t.again;return;}
  document.getElementById("qNum").textContent=t.qNum(qi+1,TOTAL);document.getElementById("qClue").textContent=clue();
  document.getElementById("qNext").textContent=qi===TOTAL-1?t.result:t.next;
  const box=document.getElementById("qOpts");
  box.innerHTML=opts.map(k=>{const x=d(k);return `<button type="button" class="opt" data-k="${k}">${x.g} ${x.n}<small>${x.other}</small></button>`;}).join("");
  box.querySelectorAll(".opt").forEach(o=>{
    if(answered){o.disabled=true;if(o.dataset.k===cur)o.classList.add("right");if(o.dataset.k===answered&&answered!==cur)o.classList.add("wrong");}
    o.onclick=()=>{if(answered)return;answered=o.dataset.k;if(answered===cur)score++;renderQ();if(autoSpeak)speak(document.getElementById("qFb").textContent,qBtn);};});
  document.getElementById("qFb").textContent=answered?(answered===cur?t.right:t.wrongIs(d(cur).n))+d(cur).story:"";
}
qBtn.onclick=()=>speak(done?document.getElementById("qClue").textContent:clue()+" "+opts.map(k=>d(k).n).join(lang==="zh"?"，":", "),qBtn);
document.getElementById("qNext").onclick=()=>{stopSpeech();
  if(done){done=false;qi=0;score=0;deck=POOL.slice().sort(()=>Math.random()-.5).slice(0,TOTAL);newQ();return;}
  if(qi===TOTAL-1){done=true;renderQ();if(autoSpeak)speak(document.getElementById("qClue").textContent,qBtn);return;}
  qi++;newQ();if(autoSpeak)speak(clue(),qBtn);};

/* ---------- language ---------- */
function applyLang(){const t=L();document.documentElement.lang=lang==="zh"?"zh-CN":"en";document.title=lang==="zh"?"奥林匹斯众神家谱":"The Gods of Olympus";
  document.querySelectorAll("[data-t]").forEach(e=>{e.innerHTML=t[e.dataset.t];});
  document.getElementById("langZh").setAttribute("aria-pressed",lang==="zh");document.getElementById("langEn").setAttribute("aria-pressed",lang==="en");
  document.getElementById("legend").innerHTML=["pri","titan","oly","god","mate"].map(c=>`<span class="cat-${c}"><i></i>${t.cat[c]}</span>`).join("");
  bandLabels.forEach((b,i)=>b.textContent=t.bands[i]);
  ids.forEach(id=>{const x=d(id);nodes[id].innerHTML=`<span class="g">${x.g}</span><span class="n1">${x.n}</span><span class="n2">${x.other}</span>`;nodes[id].setAttribute("aria-label",x.n+" "+x.other);});
  setSpeakLabel(realmBtn,t.listenStory);renderDetail();renderGrid();renderQ();updateVoiceNote();}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{if(lang===b.dataset.lang)return;stopSpeech();lang=b.dataset.lang;try{localStorage.setItem("olympus-lang",lang);}catch(e){}applyLang();});

newQ();applyLang();select("zeus");
</script>
</body>
</html>
